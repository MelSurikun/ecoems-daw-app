<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de examen · Educación Media Superior IPN-UNAM</title>
<style>
  :root{
    --bg:#f4f4f2; --card:#ffffff; --ink:#1c1c1e; --muted:#6b6b70;
    --line:#e3e3df; --brand:#5b2333; --accent:#8a3324;
    --ok:#1b7a43; --okbg:#e7f5ec; --bad:#c0392b; --badbg:#fcebea;
    --radius:14px; --maxw:820px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:120px;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 16px}
  header.top{
    background:var(--brand); color:#fff; padding:28px 16px 22px; text-align:center;
  }
  header.top h1{margin:0 0 4px; font-size:1.45rem; letter-spacing:.2px}
  header.top p{margin:0; opacity:.85; font-size:.9rem}
  header.top .meta{margin-top:10px; font-size:.8rem; opacity:.75}

  .bar{
    position:sticky; top:0; z-index:30; background:rgba(244,244,242,.95);
    backdrop-filter:saturate(1.4) blur(6px); border-bottom:1px solid var(--line);
  }
  .bar .wrap{display:flex; align-items:center; gap:12px; padding:10px 16px}
  .progress{flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden}
  .progress>i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
  .bar small{color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}

  #result{display:none; margin:18px 0 4px}
  #result.show{display:block}
  .scorecard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; text-align:center; box-shadow:0 1px 0 rgba(0,0,0,.02)
  }
  .scorecard .big{font-size:2.4rem; font-weight:700; line-height:1; color:var(--brand)}
  .scorecard .pct{font-size:1rem; color:var(--muted); margin-top:6px}
  .scorecard .msg{margin-top:8px; font-weight:600}
  table.bd{width:100%; border-collapse:collapse; margin-top:16px; font-size:.92rem}
  table.bd th,table.bd td{padding:7px 8px; border-bottom:1px solid var(--line); text-align:left}
  table.bd th{color:var(--muted); font-weight:600}
  table.bd td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

  h2.sect{
    margin:30px 0 4px; padding:10px 14px; background:var(--brand); color:#fff;
    border-radius:10px; font-size:1.05rem; letter-spacing:.3px;
    display:flex; justify-content:space-between; align-items:baseline; gap:10px
  }
  h2.sect span{font-size:.78rem; font-weight:500; opacity:.8}

  .passage{
    background:#fbf7ef; border:1px solid #ece2cf; border-left:4px solid var(--accent);
    border-radius:10px; padding:14px 16px; margin:16px 0; font-size:.95rem; white-space:pre-line
  }
  .passage .src{display:block; margin-top:8px; font-style:italic; color:var(--muted); font-size:.85rem}

  .q{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 8px; margin:14px 0; scroll-margin-top:70px
  }
  .q .head{display:flex; gap:10px; align-items:flex-start}
  .q .nbox{
    flex:none; width:30px; height:30px; border-radius:8px; background:var(--brand); color:#fff;
    display:grid; place-items:center; font-weight:700; font-size:.85rem
  }
  .q .stem{font-weight:600; margin:2px 0 0}
  .q .ctx{
    background:#f7f7f5; border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin:10px 0 4px; font-size:.92rem; white-space:pre-line; color:#333
  }
  .q figure{margin:12px 0 6px; text-align:center}
  .q figure img{max-width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff}
  .opts{list-style:none; margin:10px 0 4px; padding:0; display:grid; gap:8px}
  .opt{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; cursor:pointer; transition:background .12s,border-color .12s; background:#fff
  }
  .opt:hover{background:#faf7f3}
  .opt input{margin:3px 0 0; flex:none; accent-color:var(--accent)}
  .opt .lt{font-weight:700; color:var(--accent)}
  .opt.correct{background:var(--okbg); border-color:var(--ok)}
  .opt.wrong{background:var(--badbg); border-color:var(--bad)}
  .opt.correct .lt{color:var(--ok)}
  .opt.wrong .lt{color:var(--bad)}
  .verdict{font-size:.85rem; font-weight:600; margin:4px 0 8px; display:none}
  .verdict.show{display:block}
  .verdict.ok{color:var(--ok)}
  .verdict.bad{color:var(--bad)}
  .graded .opt{cursor:default}

  .actions{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:rgba(255,255,255,.96); backdrop-filter:blur(6px);
    border-top:1px solid var(--line); padding:12px 16px
  }
  .actions .wrap{display:flex; gap:10px; align-items:center}
  button{
    font:inherit; font-weight:600; border:none; border-radius:10px; padding:12px 18px;
    cursor:pointer; transition:transform .05s, opacity .15s
  }
  button:active{transform:translateY(1px)}
  #grade{background:var(--accent); color:#fff; flex:1}
  #reset{background:#ececec; color:#333}
  .actions small{color:var(--muted); white-space:nowrap}
  @media(max-width:520px){
    .actions small{display:none}
    header.top h1{font-size:1.2rem}
  }
  footer{padding:24px 16px 8px; text-align:center; color:var(--muted); font-size:.8rem}
</style>
</head>
<body>
<header class="top">
  <h1>Simulador de examen</h1>
  <p>Educación Media Superior · IPN-UNAM</p>
  <div class="meta">Examen muestra · 128 reactivos · Código GB26</div>
</header>

<div class="bar"><div class="wrap">
  <div class="progress"><i id="pbar"></i></div>
  <small id="pcount">0 / 128</small>
</div></div>

<div class="wrap">
  <div id="result"><div class="scorecard">
    <div class="big" id="scoreBig">0 / 128</div>
    <div class="pct" id="scorePct"></div>
    <div class="msg" id="scoreMsg"></div>
    <table class="bd"><thead><tr><th>Asignatura</th><th class="num">Aciertos</th></tr></thead>
      <tbody id="bdBody"></tbody></table>
  </div></div>
  <div id="exam"></div>
</div>

<div class="actions"><div class="wrap">
  <button id="grade">Calificar examen</button>
  <button id="reset">Reiniciar</button>
  <small id="hint">Responde y pulsa «Calificar»</small>
</div></div>

<footer>Simulador autoevaluable · uso educativo. Las respuestas correctas provienen de la clave oficial de la guía.</footer>

<script>
const DATA = [{"n": 1, "s": "Español", "q": "La ficha bibliográfica es un instrumento de investigación que", "o": ["organiza la información con una base temporal o alfabética.", "da cuenta de estudios de campo, de laboratorio y estadísticas.", "permite almacenar datos de las publicaciones, por temas, títulos o autores.", "registra exclusivamente noticias de documentos de reciente creación."], "a": "C"}, {"n": 2, "s": "Español", "q": "Selecciona el tema del siguiente texto.", "o": ["Manuel Gutiérrez Nájera tuvo una carrera productiva desde joven.", "Manuel Gutiérrez Nájera usó diferentes seudónimos para firmar su obra.", "Manuel Gutiérrez Nájera escribía mucho para numerosas publicaciones.", "Manuel Gutiérrez Nájera tenía, a los 17 años, más de 25 seudónimos."], "a": "A", "ctx": "«Manuel Gutiérrez Nájera se inició, desde muy joven, como escritor. A los diecisiete años apareció su primera publicación, y durante las dos décadas siguientes, colaboró en cerca de treinta y seis diarios y revistas literarias de la época, en ocasiones hasta con cinco entregas al día. Para tan ardua tarea utilizó alrededor de veintiséis seudónimos...» — Clark de Lara, Belem. Por donde se sube al cielo."}, {"n": 3, "s": "Español", "q": "¿Mediante qué recurso se desarrollan las ideas en el siguiente párrafo?", "o": ["Repeticiones.", "Explicaciones.", "Paráfrasis.", "Ejemplos."], "a": "B", "ctx": "«Para facilitar su estudio, los especialistas dividen la prehistoria en tres grandes etapas: el Paleolítico, el Mesolítico y el Neolítico. El periodo Paleolítico abarca desde la aparición de los primeros homínidos hace unos cuatro millones de años hasta el descubrimiento de la agricultura. El Mesolítico es una etapa de tránsito... Finalmente, la práctica de la agricultura y la ganadería es el hecho que determina el inicio del Neolítico.» — Rosario Rico et al., Historia universal."}, {"n": 4, "s": "Español", "q": "Elige las oraciones que usan nexos para introducir ideas.", "o": ["I y IV", "II y III", "I y II", "II y V"], "a": "C", "ctx": "I. El Estridentismo en México inició en 1921; fue un grupo de intelectuales que reunió pintores, músicos, además de escritores destacados.\nII. El Simbolismo y el Parnasianismo surgieron en Francia; influyeron, por ejemplo, en el Modernismo, además de legarnos una gran tradición poética.\nIII. El Modernismo es considerado como el movimiento que inaugura las literaturas de vanguardia.\nIV. Los Contemporáneos se conocían como «El grupo sin grupo», y eran intelectuales polifacéticos.\nV. Estudiar los movimientos de vanguardia nos lleva a entender la mentalidad del hombre del siglo XX."}, {"n": 5, "s": "Español", "q": "Las palabras subrayadas en el siguiente fragmento tienen como propósito", "o": ["indicar el modo en que surgen las ideas", "establecer los lugares de los eventos", "dar un orden a las ideas", "señalar el tiempo en el párrafo"], "a": "C", "ctx": "«Durante mucho tiempo el ser humano ha tenido sed de saber qué son los sueños. Mi teoría, en primer lugar, considera que son una realidad alterna similar a la del reflejo en el espejo; también pueden ser considerados una forma en la que nuestros cerebros logran vivir otras realidades; finalmente, como muchos artistas han demostrado, son fruto de mentes creativas...»"}, {"n": 6, "s": "Español", "q": "Determina cuál es el signo de puntuación que debe sustituir a la línea en el siguiente párrafo.", "o": ["comillas", "punto y seguido", "dos puntos", "coma"], "a": "C", "ctx": "«Hace poco más de una semana entrevisté a Emmanuel Carballo. No sé si fue la última entrevista que dio; realmente quisiera que no lo fuera. Me gustaría poder hacer lo que acordamos al despedirnos ____ volver a verlo en unos días, llevarle el libro que me prestó tras prometerle que era devuelvelibros y continuar con esa conversación que ya quedó por siempre trunca.» — www.jornada.unam.mx"}, {"n": 7, "s": "Español", "q": "Identifica la oración principal en el siguiente texto.", "o": ["Por esas flores ojos con aromas", "Las flores son los ojos de las plantas", "Abuelo, ¿qué son las flores?", "Curan el alma de los hombres"], "a": "B", "ctx": "ABUELO, ¿QUÉ SON LAS FLORES? —Las flores son los ojos de las plantas; como tus ojos son las flores en el jardín de tu rostro. Por esas flores ojos de colores con aromas, las plantas miran, atraen, alegran y curan el alma de los hombres. — Miguel Cocom Pech, poeta maya."}, {"n": 8, "s": "Español", "q": "¿Cuál de las siguientes oraciones está en tiempo presente de indicativo histórico?", "o": ["Mi mamá cocina un rico pastel.", "Cristóbal Colón descubre América en 1492.", "Mañana regresa mi abuela de Celaya.", "Me lavo los dientes todas las mañanas."], "a": "B"}, {"n": 9, "s": "Español", "q": "Lee el siguiente párrafo e indica a qué categoría pertenecen los elementos subrayados.", "o": ["Sustantivos", "Gerundios", "Participios", "Adjetivos"], "a": "D", "ctx": "«Jorge era un hombre, un grave guerrero hermoso a su manera, digno de la admiración con que le miraba Miguel. Alto y membrudo, llevaba con marcial desembarazo [...] el arnés entero de batalla [...]. El rostro de Jorge respiraba ardor y lealtad; pálido, de garzos ojos, una puntiaguda barba castaña lo hacía más varonil.» (subrayados: grave, hermoso, digno, marcial, varonil)"}, {"n": 10, "s": "Español", "q": "¿En qué tiempo están conjugados los verbos subrayados en el siguiente texto?", "o": ["Antepretérito", "Copretérito", "Pretérito", "Antepospretérito"], "a": "B", "ctx": "«Aureliano, el primer ser humano que nació en Macondo [...]. Mientras le cortaban el ombligo movía la cabeza de un lado a otro reconociendo las cosas del cuarto y examinaba el rostro de la gente con una curiosidad sin asombro.» — G. García Márquez, Cien años de soledad. (subrayados: cortaban, movía, examinaba)"}, {"n": 11, "s": "Español", "q": "En la frase subrayada se advierte que la intención de quien habla es", "o": ["describir un acontecimiento", "narrar un evento", "justificar una acción", "dar una opinión"], "a": "D", "ctx": "«Este filme es importante para la cultura latina, porque se hacen pocas películas tan reales y fuertes como ésta», aseguró López en una reciente mesa redonda con periodistas en Los Ángeles. (sobre la película Spare Parts / La vida robot)"}, {"n": 12, "s": "Español", "q": "Identifica el anuncio publicitario en el que se exageran las cualidades del producto.", "o": ["Crema Vida nueva, agradable e intensa compañía para tu piel.", "¿Cansado de pensar? Adquiere nuestro programa de habilidades, un botón que hará tareas por ti.", "Si piensas seguir viviendo no olvides tener a tu lado Esperanza, la pastilla que realmente renovará tus ganas de vivir.", "La alimentación mediante productos Paraíso terrenal favorecerá llevar una vida llena de salud."], "a": "C"}, {"n": 13, "s": "Habilidad verbal", "q": "El texto relata una historia en la que", "o": ["el contador de cuentos dice a los niños que saca del pozo los cuentos que cuenta, y él prefiere contárselos a la preguntona.", "un hombre que se sienta en el brocal del pozo le cuenta a una niña preguntona el secreto del pozo.", "el contador de cuentos embelesa a los niños con sus historias; le confiesa a la preguntona que se los cuenta el pozo.", "el cuentacuentos le habla a una persona que está fuera de la historia y le dice que saca los cuentos del pozo."], "a": "C", "passage": "El contador de cuentos — Carmen Báez, La Roba Pájaros\n\n—¿De dónde sacas tus cuentos? —Del pozo. —¿Del pozo? —Sí, de pozo. Del fondo del pozo. Están revueltos con el agua, con las ranas y con las estrellas, pero hay que saber sacarlos.\nEl contador de cuentos guarda un silencio de enigma. Sentado sobre los adobes de la barda y balanceando al aire sus piernas de barro, mira de reojo a la preguntona. La preguntona es una niñita frágil, como de cera: blanca y crédula.\nEl contador de cuentos sabe la importancia que sus embustes le han ganado entre la chiquillería de Palo Verde. Al final de los días, cuando empieza a parpadear la tarde, él se sienta en la barda que marca una raya paralela entre la milpa y el camino. Allí van todos los niños del pueblo a embaucarse con el milagro de su fantasía plagada de campanas, de príncipes malos y de mendigos santos, de coyotes, de nahuales y de brujas.\n—¿Sabes? —dice como haciendo a la preguntona la merced de confiarle un secreto— El pozo dice sus cuentos en las noches. Cuando hay luna es cuando se pueden sacar los más bonitos. —¿Y cómo los sacas? —¡Pues nada! Me siento en el brocal y meto la cabeza dentro. Allí me estoy quietecito, mirando para abajo y escuchando, escuchando. Luego de estar así un rato puedo oír lo que el pozo dice. El auditorio contiene la respiración para que no se escape ni una sola de las palabras que el embustero hilvana."}, {"n": 14, "s": "Habilidad verbal", "q": "Completa el siguiente cuadro sinóptico (Niña: Preguntona / I / Blanca y crédula. Contador: Piernas de adobe / II / III. Auditorio: Originario de Palo Verde / Público infantil / IV).", "o": ["I. Frágil, II. Embustero, III. Imaginativo, IV. Atento", "I. Atenta, II. Imaginativo, III. Frágil, IV. Embustero", "I. Frágil, II. Atento, III. Embustero, IV. Imaginativo", "I. Frágil, II. Imaginativo, III. Atento, IV. Embustero"], "a": "A"}, {"n": 15, "s": "Habilidad verbal", "q": "En la oración «La preguntona es una niñita frágil, como de cera: blanca y crédula», encontramos una relación", "o": ["comparativa", "ejemplificativa", "analógica", "explicativa"], "a": "A"}, {"n": 16, "s": "Habilidad verbal", "q": "En el texto, el término «brocal» se refiere a", "o": ["una hilera de piedras en el lago", "un muro que rodea al pozo", "una tinaja con agua del pozo", "la barda de adobe"], "a": "B"}, {"n": 17, "s": "Habilidad verbal", "q": "Según el sentido global del texto, los avances en las investigaciones de los agujeros negros han sido", "o": ["dudosos", "notables", "ficticios", "certeros"], "a": "B", "passage": "Los agujeros negros: ¿realidad o ficción?\n\nEl Universo, con su oscuridad e inmensidad, guarda aún muchos misterios para el hombre, a pesar de que la investigación científica en este campo ha sido constante y apasionada, con el fin de conocer lo que hay más allá de nuestro mundo. Los agujeros negros entran en esta diversidad de cuerpos siderales que habitan el espacio infinito. Mucho se ha estudiado y conjeturado sobre ellos; algunos piensan que son producto de la ciencia ficción y que sólo tienen cabida en las películas y relatos fantásticos.\nEl término agujero negro fue acuñado en 1967 por el físico estadounidense John Wheeler, pero el primero en tratar de explicarlos fue John Mitchell en 1783, cuando habla de la atracción gravitacional que ejerce cualquier cuerpo celeste sobre los objetos, en especial la luz. Es hasta la Teoría General de la Relatividad de Albert Einstein que se pudo dar una definición convincente: una estrella altamente masiva y compacta tiene un campo gravitatorio tan intenso que la luz no puede escapar; como nada viaja más rápido que la luz, de los agujeros negros no escapan partículas u ondas.\nEn 1967, Werner Israel demostró que los agujeros negros sin rotación son perfectamente esféricos y su tamaño depende únicamente de la masa. Roy Kerr descubrió que los hoyos negros con rotación constante se deforman: se achatan en los polos como la Tierra; cuanto más rápido giran, más se deforman. Estos cuerpos siguen ejerciendo fuerza gravitatoria sobre los cuerpos cercanos y aspiran la materia de planetas y estrellas vecinos. El ejemplo más claro es el sistema Cygnus X-1, en la constelación de Cisne.\nAunque el avance ha sido gigante, falta resolver: ¿qué hay detrás de estos habitantes siderales?, ¿a dónde conducen? Algunos astrónomos, entre ellos Carl Sagan, han establecido la posibilidad de que los hoyos negros sean túneles que conduzcan a otros sistemas solares, galaxias o universos."}, {"n": 18, "s": "Habilidad verbal", "q": "¿Cuál de los siguientes enunciados es una hipótesis?", "o": ["La gravedad ejerce atracción sobre cualquier cuerpo celeste.", "Nada viaja más rápido que la luz.", "Los agujeros negros sin rotación son perfectamente esféricos.", "Los hoyos negros posiblemente son túneles."], "a": "D"}, {"n": 19, "s": "Habilidad verbal", "q": "¿Cuál es el tema del texto?", "o": ["El Universo y los muchos misterios que aún guarda para el hombre", "Los científicos que han estudiado los hoyos negros", "Los hoyos negros y su posible conexión con otros universos", "La explicación del fenómeno de los agujeros negros"], "a": "D"}, {"n": 20, "s": "Habilidad verbal", "q": "ANALOGÍA — MÚSICO es a INSTRUMENTO como", "o": ["poeta a poesía", "mecánico a herramienta", "político a ley", "carpintero a carpintería"], "a": "B"}, {"n": 21, "s": "Habilidad verbal", "q": "ANALOGÍA — TENIS es a CORRER como zapatilla es a", "o": ["calzar", "trotar", "caminar", "ballet"], "a": "D"}, {"n": 22, "s": "Habilidad verbal", "q": "ANALOGÍA — HIJO – DESCENDIENTE", "o": ["abuelo – ascendiente", "tío – madre", "madrina – consanguínea", "primo – familiar"], "a": "A"}, {"n": 23, "s": "Habilidad verbal", "q": "ANTÓNIMO — Los superhéroes se distinguen por su carácter BIZARRO.", "o": ["Alegre", "Cobarde", "Estable", "Tímido"], "a": "B"}, {"n": 24, "s": "Habilidad verbal", "q": "ANTÓNIMO — PADECER", "o": ["Aceptar", "Gozar", "Sufrir", "Rechazar"], "a": "B"}, {"n": 25, "s": "Habilidad verbal", "q": "ANTÓNIMO — Actividades CLANDESTINAS.", "o": ["Secretas", "Ilícitas", "Ocultas", "Públicas"], "a": "D"}, {"n": 26, "s": "Habilidad verbal", "q": "SINÓNIMO — Sus palabras fueron ENTRAÑABLES.", "o": ["Afectuosas", "Honestas", "Violentas", "Frías"], "a": "A"}, {"n": 27, "s": "Habilidad verbal", "q": "SINÓNIMO — Las ocurrencias del Chapulín Colorado me causan HILARIDAD.", "o": ["Entusiasmo", "Risa", "Flojera", "Aburrimiento"], "a": "B"}, {"n": 28, "s": "Habilidad verbal", "q": "SINÓNIMO — El médico actuó con CELERIDAD.", "o": ["Rapidez", "Lentitud", "Dilación", "Sencillez"], "a": "A"}, {"n": 29, "s": "Matemáticas", "q": "Encuentra el re : ["de la Ilustración", "del Renacimiento", "del Humanismo", "del Romanticismo"], "a": "A"}, {"n": 95, "s": "Historia", "q": "Según el nacionalismo del siglo XIX, ¿qué determina lo nacional en cada Estado?", "o": ["El sentimiento de colectividad derivado del idioma, costumbres e historia común", "La solidaridad social en relación con las diferencias culturales de su población", "Los intereses tradicionales de una sociedad enfocados a resolver asuntos económicos", "El pensamiento de una población que defiende su religión por encima de todo"], "a": "A"}, {"n": 96, "s": "Historia", "q": "En el periodo de entreguerras, la política fascista de Italia se caracterizó por la", "o": ["quema de sinagogas", "desintegración del parlamento", "persecución de los judíos", "noche de los cristales rotos"], "a": "B"}, {"n": 97, "s": "Historia", "q": "La Revolución electrónica trajo consigo el desarrollo de una nueva ciencia llamada", "o": ["biogenética", "física nuclear", "bioquímica", "informática"], "a": "D"}, {"n": 98, "s": "Historia", "q": "Un efecto negativo de la globalización en el medio ambiente se observa en", "o": ["la intensificación en el uso de productos orgánicos", "el aumento de reservas ecológicas protegidas", "la búsqueda de soluciones para evitar la extinción de especies", "el agotamiento de los recursos naturales"], "a": "D"}, {"n": 99, "s": "Historia", "q": "Fue el medio de mayor relevancia para mantener el poder ideológico de la Iglesia novohispana.", "o": ["El Tribunal de la Acordada", "El Santo Oficio de la Inquisición", "El Tribunal de la Santa Cruzada", "El Provisorato de Indios"], "a": "B"}, {"n": 100, "s": "Historia", "q": "El absolutismo ilustrado de los Borbones se caracterizó por", "o": ["limitar a la Iglesia y centralizar el poder", "dar autonomía a la iglesia y a los cabildos indígenas", "dar libertades a las colonias e impulsar el comercio", "incluir a los criollos en cargos públicos y promover la libertad de comercio"], "a": "A"}, {"n": 101, "s": "Hi : "Formación cívica y ética", "q": "Relaciona los derechos y obligaciones de los adolescentes (I. Derecho, II. Obligación) con el ejemplo: a) Respeto de los padres a los hijos. b) Responsabilidad en los estudios. c) Cumplimiento de las normas sociales. d) Contar con servicios de salud gratuitos.", "o": ["I: a, d – II: b, c", "I: a, c – II: b, d", "I: b, c – II: a, d", "I: c, d – II: b, a"], "a": "A"}, {"n": 121, "s": "Formación cívica y ética", "q": "El dueño de un establecimiento paga a sus empleados adolescentes un sueldo menor al salario mínimo, argumentando que no tienen necesidades importantes que satisfacer, como los adultos casados. Esta situación describe un tipo de", "o": ["favoritismo económico empresarial", "violencia económica a los adolescentes", "violencia psicológica a los adolescentes", "economía propia de la adolescencia"], "a": "B"}, {"n": 122, "s": "Formación cívica y ética", "q": "Ernesto y sus amigos no quieren juntarse en el recreo con Sebastián y sus compañeros porque dicen que son morenos, judíos y pobres. La actitud anterior es un ejemplo de discriminación", "o": ["racial, religiosa y económica", "sexual, religiosa y económica", "religiosa, racial y educativa", "educativa, religiosa y económica"], "a": "A"}, {"n": 123, "s": "Formación cívica y ética", "q": "El poder ________, de acuerdo con la Constitución, interpreta y aplica las normas para resolver conflictos.", "o": ["Legislativo", "Ejecutivo", "Absoluto", "judicial"], "a": "D"}, {"n": 124, "s": "Formación cívica y ética", "q": "Entidad de interés público a la que se puede afiliar cualquier ciudadano que comparta las mismas ideas y pueda proponer candidatos a los cargos públicos con el fin de participar en la democracia del país.", "o": ["Partido Político", "Institución de Asistencia Privada", "Asociación Civil", "Instituto Nacional Electoral"], "a": "A"}, {"n": 125, "s": "Formación cívica y ética", "q": "En una elección democrática el voto debe ser", "o": ["libre, total y secreto", "abierto, directo y secreto", "libre, secreto y directo", "libre, secreto e indirecto"], "a": "C"}, {"n": 126, "s": "Formación cívica y ética", "q": "Un medio de comunicación cumple con una función social cuando", "o": ["organiza la ayuda para los damnificados por desastres naturales", "está involucrado en el servicio al sistema económico y la publicidad", "forma opiniones basadas en los comentarios de terceros", "convence al receptor sobre un tema específico mediante la persuasión"], "a": "A"}, {"n": 127, "s": "Formación cívica y ética", "q": "Cuidar las áreas verdes en tu comunidad, levantar las heces de los perros, separar la basura y realizar actividades al aire libre, son acciones relacionadas con", "o": ["lograr una mejor calidad de vida", "desarrollar conciencia moral", "pertenecer a grupos de cuidado del ambiente", "responder a la influencia social"], "a": "A"}, {"n": 128, "s": "Formación cívica y ética", "q": "Cuando Juan y Ana buscan hablar con José para solucionar el conflicto, están usando el recurso llamado", "o": ["mediación", "arbitraje", "negociación", "legalidad"], "a": "C", "ctx": "Juan y Ana acaban de rentar un departamento; al revisarlo notaron varias descomposturas. Tras dialogar deciden ir con José, el dueño, a pedirle que se hagan las reparaciones; José se niega alegando que debieron revisarlo antes de aceptarlo, por lo que Ana y Juan solicitaron la intervención de las autoridades."}];
const FIGS = {
  "q36_tabla": "images/P36.png",
  "q40_paralelo": "images/P40.png",
  "q45_tri": "images/P45.png",
  "q46_pie": "images/P46.png",
  "q47_pts": "images/P47.png",
  "q48_lineas": "images/P48.png",
  "q49_cubo": "images/P49.png",
  "q50_cubo": "images/P50.png",
  "q51_cubos": "images/P51.png",
  "q52_dado": "images/P52.png",
  "q54_rueda": "images/P54.png",
  "q69_graf": "images/P69.png",
  "q70_graf": "images/P70.png",
  "q71_cajas": "images/P71.png",
  "q106_mapa": "images/P106.png"
};
const LT = ["A","B","C","D"];
const exam = document.getElementById("exam");
let graded = false;

let curSubject = null;
const subjCount = {};
DATA.forEach(q => subjCount[q.s] = (subjCount[q.s]||0)+1);

DATA.forEach(q => {
  if(q.s !== curSubject){
    curSubject = q.s;
    const h = document.createElement("h2");
    h.className = "sect";
    h.innerHTML = `<span>&nbsp;</span>`;
    h.insertAdjacentHTML("afterbegin", `${esc(q.s)}`);
    h.insertAdjacentHTML("beforeend", `<span>${subjCount[q.s]} reactivos</span>`);
    exam.appendChild(h);
  }
  if(q.passage){
    const p = document.createElement("div");
    p.className = "passage";
    p.textContent = q.passage;
    exam.appendChild(p);
  }
  const card = document.createElement("div");
  card.className = "q";
  card.id = "q"+q.n;

  let inner = `<div class="head"><div class="nbox">${q.n}</div><div class="stem">${esc(q.q)}</div></div>`;
  if(q.ctx){ inner += `<div class="ctx">${esc(q.ctx)}</div>`; }
  if(q.fig && FIGS[q.fig]){
    inner += `<figure><img alt="Figura del reactivo ${q.n}" src="${FIGS[q.fig]}"></figure>`;
  }
  inner += `<ul class="opts" data-n="${q.n}">`;
  q.o.forEach((opt,i) => {
    inner += `<li class="opt" data-letter="${LT[i]}">
      <input type="radio" name="q${q.n}" value="${LT[i]}" id="q${q.n}${LT[i]}">
      <span class="lt">${LT[i]})</span>
      <label for="q${q.n}${LT[i]}" style="flex:1;cursor:inherit">${esc(opt)}</label>
    </li>`;
  });
  inner += `</ul><div class="verdict" id="v${q.n}"></div>`;
  card.innerHTML = inner;
  exam.appendChild(card);

  card.querySelectorAll(".opt").forEach(li => {
    li.addEventListener("click", e => {
      if(graded) return;
      const inp = li.querySelector("input");
      inp.checked = true;
      updateProgress();
    });
  });
});

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function answered(){ return DATA.filter(q => document.querySelector(`input[name="q${q.n}"]:checked`)).length; }
function updateProgress(){
  const a = answered();
  document.getElementById("pcount").textContent = `${a} / ${DATA.length}`;
  document.getElementById("pbar").style.width = (a/DATA.length*100)+"%";
}

document.getElementById("grade").addEventListener("click", () => {
  if(graded){ window.scrollTo({top:0,behavior:"smooth"}); return; }
  const a = answered();
  if(a < DATA.length){
    if(!confirm(`Has respondido ${a} de ${DATA.length}. Las no respondidas contarán como incorrectas. ¿Calificar de todos modos?`)) return;
  }
  graded = true;
  let total = 0;
  const bySub = {};
  DATA.forEach(q => {
    bySub[q.s] = bySub[q.s] || {ok:0,tot:0};
    bySub[q.s].tot++;
    const card = document.getElementById("q"+q.n);
    card.classList.add("graded");
    const chosen = document.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = chosen ? chosen.value : null;
    const v = document.getElementById("v"+q.n);
    card.querySelectorAll(".opt").forEach(li => {
      const L = li.dataset.letter;
      li.querySelector("input").disabled = true;
      if(L === q.a) li.classList.add("correct");
      else if(L === pick) li.classList.add("wrong");
    });
    if(pick === q.a){
      total++; bySub[q.s].ok++;
      v.className = "verdict ok show"; v.textContent = "✓ Correcta";
    }else{
      v.className = "verdict bad show";
      v.textContent = pick ? `✗ Tu respuesta: ${pick} · Correcta: ${q.a}` : `✗ Sin responder · Correcta: ${q.a}`;
    }
  });

  const pct = Math.round(total/DATA.length*100);
  document.getElementById("scoreBig").textContent = `${total} / ${DATA.length}`;
  document.getElementById("scorePct").textContent = `${pct}% de aciertos`;
  const msg = document.getElementById("scoreMsg");
  if(pct>=80){ msg.textContent="¡Excelente desempeño!"; msg.style.color="var(--ok)"; }
  else if(pct>=60){ msg.textContent="Buen avance, sigue practicando."; msg.style.color="var(--accent)"; }
  else { msg.textContent="A reforzar: repasa los temas marcados."; msg.style.color="var(--bad)"; }

  const tb = document.getElementById("bdBody"); tb.innerHTML="";
  Object.keys(bySub).forEach(s => {
    tb.insertAdjacentHTML("beforeend",
      `<tr><td>${esc(s)}</td><td class="num">${bySub[s].ok} / ${bySub[s].tot}</td></tr>`);
  });
  document.getElementById("result").classList.add("show");
  document.getElementById("grade").textContent = "Ver resultados ▲";
  document.getElementById("hint").textContent = "Examen calificado";
  window.scrollTo({top:0,behavior:"smooth"});
});

document.getElementById("reset").addEventListener("click", () => {
  if(graded && !confirm("¿Reiniciar el examen y borrar tus respuestas?")) return;
  graded = false;
  DATA.forEach(q => {
    const card = document.getElementById("q"+q.n);
    card.classList.remove("graded");
    card.querySelectorAll(".opt").forEach(li => {
      li.classList.remove("correct","wrong");
      const inp = li.querySelector("input"); inp.checked=false; inp.disabled=false;
    });
    document.getElementById("v"+q.n).className = "verdict";
  });
  document.getElementById("result").classList.remove("show");
  document.getElementById("grade").textContent = "Calificar examen";
  document.getElementById("hint").textContent = "Responde y pulsa «Calificar»";
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
});

updateProgress();
</script>
